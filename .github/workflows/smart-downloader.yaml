name: '📦 دانلود و آپلود قطعات جداگانه (Artifact)'

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: '🔗 لینک مستقیم فایل‌ها (با کاما جدا کنید) مثال: url1,url2,url3'
        required: true
        type: string
      custom_names:
        description: '📝 نام دلخواه (اختیاری، با کاما جدا، بدون پسوند) مثال: film,ahang'
        required: false
        type: string
        default: ''
      password:
        description: '🔐 رمز فایل فشرده (اختیاری)'
        required: false
        type: string

jobs:
  download-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file aria2 curl

      - name: 📥 پردازش، فشرده‌سازی و آپلود جداگانه
        env:
          GH_TOKEN: ${{ github.token }}   # برای استفاده از دستور gh
        run: |
          set +v
          echo "${{ github.event.inputs.file_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/urls.txt
          TOTAL_URLS=$(wc -l < /tmp/urls.txt)
          echo "🔹 تعداد کل لینک‌ها: $TOTAL_URLS"

          IFS=',' read -ra NAME_ARRAY <<< "${{ github.event.inputs.custom_names }}"
          for idx in "${!NAME_ARRAY[@]}"; do
            NAME_ARRAY[$idx]=$(echo "${NAME_ARRAY[$idx]}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          done

          COUNTER=0
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            COUNTER=$((COUNTER+1))
            echo ""
            echo "============================================================"
            echo "🔽 [${COUNTER}/${TOTAL_URLS}] شروع پردازش: $URL"
            echo "============================================================"

            # ----- مرحله ۱: استخراج نام فایل -----
            echo "🔍 [1/4] شناسایی نام فایل..."
            if [ -n "${NAME_ARRAY[$((COUNTER-1))]}" ]; then
              REAL_FILENAME="${NAME_ARRAY[$((COUNTER-1))]}"
              echo "   🏷️ استفاده از نام دلخواه: $REAL_FILENAME"
            else
              REAL_FILENAME=$(curl -sI "$URL" | grep -i 'Content-Disposition' | sed -n 's/.*filename="\([^"]*\)".*/\1/p')
              if [ -z "$REAL_FILENAME" ]; then
                REAL_FILENAME=$(echo "$URL" | grep -oP '(?<=filename=)[^&]+' | sed 's/%20/ /g' 2>/dev/null || true)
              fi
              if [ -z "$REAL_FILENAME" ]; then
                REAL_FILENAME=$(basename "$URL" | sed 's/\?.*//' | sed 's/%20/ /g')
              fi
              if [ -z "$REAL_FILENAME" ]; then
                REAL_FILENAME="file_$(date +%s)"
              fi
            fi
            SAFE_FILENAME=$(echo "$REAL_FILENAME" | sed 's/[\\/:*?"<>|]/_/g')
            echo "   📛 نام پایه: $SAFE_FILENAME"

            # ----- مرحله ۲: دانلود (با تلاش مجدد) -----
            echo "⏳ [2/4] دانلود فایل..."
            MAX_RETRIES=10
            RETRY=0
            SUCCESS=false
            while [ $RETRY -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
              if [ $RETRY -gt 0 ]; then
                echo "   ⚠️ تلاش مجدد $RETRY/$MAX_RETRIES (بعد از ۱۰ ثانیه)..."
                sleep 10
              fi
              aria2c --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                     --max-connection-per-server=4 --split=4 --min-split-size=1M \
                     --continue=true --retry-wait=10 --max-tries=1 --timeout=60 \
                     --console-log-level=error -o "$SAFE_FILENAME" "$URL" > /tmp/aria2.log 2>&1
              if [ $? -eq 0 ]; then
                SUCCESS=true
                echo "   ✅ دانلود کامل شد."
              else
                RETRY=$((RETRY+1))
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ خطا: دانلود $SAFE_FILENAME ناموفق بود. رد کردن این لینک..."
              continue
            fi

            # ----- مرحله ۳: تشخیص فرمت و اصلاح پسوند -----
            echo "🔍 [3/4] تشخیص فرمت فایل و اصلاح پسوند..."
            REAL_MIME=$(file -b --mime-type "$SAFE_FILENAME")
            EXT=""
            case "$REAL_MIME" in
              video/mp4) EXT="mp4" ;; video/webm) EXT="webm" ;;
              video/x-matroska) EXT="mkv" ;; audio/mpeg) EXT="mp3" ;;
              audio/ogg) EXT="ogg" ;; image/jpeg) EXT="jpg" ;;
              image/png) EXT="png" ;; application/pdf) EXT="pdf" ;;
              application/zip) EXT="zip" ;;
              application/x-rar-compressed|application/vnd.rar) EXT="rar" ;;
              application/vnd.android.package-archive) EXT="apk" ;;
            esac
            if [ -n "$EXT" ]; then
              BASENAME_NOEXT="${SAFE_FILENAME%.*}"
              NEW_NAME="${BASENAME_NOEXT}.$EXT"
              if [ "$NEW_NAME" != "$SAFE_FILENAME" ]; then
                mv "$SAFE_FILENAME" "$NEW_NAME"
                SAFE_FILENAME="$NEW_NAME"
                echo "   ✅ پسوند اضافه شد: $SAFE_FILENAME"
              else
                echo "   ✅ پسوند درست است."
              fi
            else
              echo "   ⚠️ فرمت ناشناخته، بدون تغییر باقی ماند."
            fi

            # ----- مرحله ۴: فشرده‌سازی به قطعات ۹۰ مگابایتی -----
            echo "📁 [4/4] ایجاد قطعات ۹۰ مگابایتی..."
            BASENAME_NOEXT="${SAFE_FILENAME%.*}"
            FOLDER_NAME=$(echo "$BASENAME_NOEXT" | sed 's/[\\/:*?"<>|]/_/g')
            [ -z "$FOLDER_NAME" ] && FOLDER_NAME="downloaded_file"

            # پوشه موقت برای قطعات
            WORK_DIR="tmp_${FOLDER_NAME}_$$"
            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            if [ -z "${{ github.event.inputs.password }}" ]; then
              7z a -mhe=on -mx=7 -md=128m -v90m "archive.7z" "../$SAFE_FILENAME" > /dev/null
            else
              7z a -p"${{ github.event.inputs.password }}" -mhe=on -mx=7 -md=64m -v90m "archive.7z" "../$SAFE_FILENAME" > /dev/null
            fi
            cd ..

            # حذف فایل اصلی برای آزادسازی فضا
            rm -f "$SAFE_FILENAME"
            echo "   ✅ قطعات ساخته شدند:"
            ls -lh "$WORK_DIR"/

            # ----- آپلود هر قطعه به عنوان یک Artifact جداگانه -----
            echo "📤 آپلود قطعات به عنوان Artifact (قابل دانلود تکی از همین صفحه)..."
            for vol in "$WORK_DIR"/archive.7z.*; do
              # نام Artifact را مثلاً myfile_part001 می‌سازیم
              PART_NAME=$(echo "$(basename "$vol")" | sed 's/archive\.7z\./part/')
              ARTIFACT_NAME="${FOLDER_NAME}_${PART_NAME}"
              echo "   📦 آپلود $ARTIFACT_NAME ..."
              gh run upload-artifact --name "$ARTIFACT_NAME" --path "$vol"
            done

            # پاکسازی پوشه موقت
            rm -rf "$WORK_DIR"
            echo "✅ فایل $COUNTER از $TOTAL_URLS پردازش و قطعات آن آپلود شد."

          done < /tmp/urls.txt

          echo ""
          echo "============================================================"
          echo "🎉 همه لینک‌ها پردازش شدند."
          echo "برای دانلود قطعات، به پایین همین صفحه (بخش Artifacts) مراجعه کنید."
          echo "============================================================"
